name: Android chat integration
on:
  workflow_dispatch:
jobs:
  chat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm ci --ignore-scripts
          npx patch-package
          npm run build
          npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/tools/node_modules/playwright/index.mjs"
          node scripts/mobile-chat-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-evidence
          path: chat-smoke-results/
