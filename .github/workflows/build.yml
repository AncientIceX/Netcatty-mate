name: Build Netcatty Mate Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: netcatty-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Netcatty Mate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies & Build Official Netcatty Bundle
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          npx patch-package
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-webgl-atlas.cjs
          node scripts/copy-monaco.cjs
          npm run build
          npx tsc --noEmit -p tsconfig.json > mobile-typecheck.log 2>&1 || true
          if grep -E '^(infrastructure/mobile/|android/|components/cloud-sync/CloudSyncControls|components/CloudSyncSettings|components/sftp/SftpFileRow|components/sftp/SftpPaneTreeNode|infrastructure/persistence/localStorageAdapter|infrastructure/config/i18n|application/state/useAutoSync|infrastructure/services/adapters/)' mobile-typecheck.log; then
            echo 'Mobile changes have TypeScript errors'; exit 1
          fi
          node --experimental-strip-types scripts/mobile-bridge-test.mjs
          node --test scripts/mobile-ui-safety.test.cjs
          node --import tsx --test infrastructure/services/cloudSync/mobilePullOnly.test.ts
          python -m pip install javalang
          python scripts/mobile-native-safety.py
          mkdir -p android/assets/www
          cp -r dist/* android/assets/www/
          ls -la android/assets/www/

      - name: Download JSch 0.2.21 & BouncyCastle 1.79 Libraries
        run: |
          mkdir -p build_libs
          curl -fsSL https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.21/jsch-0.2.21.jar -o build_libs/jsch.jar
          curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar -o build_libs/bcprov.jar
          ls -lh build_libs/

      - name: Compile & Sign Android APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          BT_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          PLATFORM_DIR=$(ls -1d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"
          echo "Using build-tools: $BT_DIR"
          echo "Using platform: $ANDROID_JAR"

          mkdir -p build_apk/gen build_apk/obj build_apk/dex dist_apk

          echo "1. Compiling resources with aapt..."
          "$BT_DIR/aapt" package -f -m \
            -J build_apk/gen \
            -M android/AndroidManifest.xml \
            -S android/res \
            -I "$ANDROID_JAR"

          echo "2. Compiling Java sources with javac..."
          javac -source 1.8 -target 1.8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR:build_libs/jsch.jar:build_libs/bcprov.jar" \
            -d build_apk/obj \
            build_apk/gen/de/newaii/netcatty/R.java \
            android/src/de/newaii/netcatty/*.java

          echo "3. Converting bytecode + JSch + BouncyCastle to DEX with d8..."
          JAR_CLASSES=$(find build_apk/obj -name "*.class")
          "$BT_DIR/d8" --lib "$ANDROID_JAR" --min-api 24 --release --output build_apk/dex \
            $JAR_CLASSES \
            build_libs/jsch.jar \
            build_libs/bcprov.jar

          echo "4. Packaging unsigned APK..."
          "$BT_DIR/aapt" package -f \
            -M android/AndroidManifest.xml \
            -S android/res \
            -A android/assets \
            -I "$ANDROID_JAR" \
            -0 png -0 jpg -0 webp -0 svg -0 woff2 -0 ttf -0 wasm \
            -F build_apk/unsigned.apk build_apk/dex

          echo "5. Zipaligning APK..."
          "$BT_DIR/zipalign" -f -p 4 build_apk/unsigned.apk build_apk/aligned.apk

          echo "6. Signing APK..."
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > build_apk/release.p12
          chmod 600 build_apk/release.p12

          "$BT_DIR/apksigner" sign \
            --ks build_apk/release.p12 \
            --ks-key-alias netcattykey \
            --ks-pass env:ANDROID_SIGNING_PASSWORD \
            --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out dist_apk/Netcatty-Mate-v3.1.0-Android.apk \
            build_apk/aligned.apk

          ls -lh dist_apk/Netcatty-Mate-v3.1.0-Android.apk

      - name: Verify APK signature and publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mate-android-v3.1.0
          path: dist_apk/*.apk

      - name: Verify signed APK
        run: |
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose dist_apk/Netcatty-Mate-v3.1.0-Android.apk

      - name: Publish GitHub Release v3.1.0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist_apk/Netcatty-Mate-v3.1.0-Android.apk \
            --verify-tag --title "Netcatty Mate v3.1.0" --notes-file android/RELEASE-v3.1.0.md
