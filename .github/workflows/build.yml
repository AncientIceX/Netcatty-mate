name: Build Netcatty Mate Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      chat_only:
        type: boolean
        default: false

concurrency:
  group: netcatty-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Netcatty Mate Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies & Build Official Netcatty Bundle
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          npx patch-package
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-webgl-atlas.cjs
          node scripts/copy-monaco.cjs
          npm install --prefix "$RUNNER_TEMP/boot-tools" --ignore-scripts playwright@1.58.2
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/boot-tools/node_modules/playwright/index.mjs"
          "$RUNNER_TEMP/boot-tools/node_modules/.bin/playwright" install --with-deps chromium
          if [ "${{ inputs.chat_only }}" = "true" ]; then
            npm run build
            node --import tsx scripts/mobile-chat-network-test.mjs
            exit 0
          fi
          cp infrastructure/mobile/androidBridgePolyfill.ts "$RUNNER_TEMP/fixed-bridge.ts"
          git show v3.1.1:infrastructure/mobile/androidBridgePolyfill.ts > infrastructure/mobile/androidBridgePolyfill.ts
          if node scripts/mobile-startup-test.mjs > baseline-startup.log 2>&1; then
            echo 'Regression did not detect v3.1.1'; exit 1
          fi
          cat baseline-startup.log
          npm run build
          node scripts/mobile-boot-smoke.mjs --baseline
          cp "$RUNNER_TEMP/fixed-bridge.ts" infrastructure/mobile/androidBridgePolyfill.ts
          npm run build
          node scripts/mobile-startup-test.mjs
          node scripts/mobile-boot-smoke.mjs
          git show v3.1.3:infrastructure/mobile/androidBridgePolyfill.ts > infrastructure/mobile/androidBridgePolyfill.ts
          npm run build
          node scripts/mobile-ai-smoke.mjs --baseline
          cp "$RUNNER_TEMP/fixed-bridge.ts" infrastructure/mobile/androidBridgePolyfill.ts
          cp application/app/AppView.tsx "$RUNNER_TEMP/fixed-app-view.tsx"
          cp components/ui/dialog.tsx "$RUNNER_TEMP/fixed-dialog.tsx"
          git show v3.1.2:application/app/AppView.tsx > application/app/AppView.tsx
          git show v3.1.2:components/ui/dialog.tsx > components/ui/dialog.tsx
          npm run build
          node scripts/mobile-webdav-smoke.mjs --baseline
          cp "$RUNNER_TEMP/fixed-app-view.tsx" application/app/AppView.tsx
          cp "$RUNNER_TEMP/fixed-dialog.tsx" components/ui/dialog.tsx
          npm run build
          node scripts/mobile-webdav-smoke.mjs
          node scripts/mobile-ai-smoke.mjs
          node --import tsx scripts/mobile-chat-network-test.mjs
          node --import tsx scripts/mobile-privacy-test.mjs
          node --import tsx --test infrastructure/ai/harness/modelPrivacy.test.ts
          mkdir -p chat-smoke-results
          printf '%s\n' 'SKIPPED: production UI provider-selection/send interaction; no real provider credentials; isolated runtime/network fixture below.' > chat-smoke-results/UI-SKIPPED.txt
          git show v3.1.6:infrastructure/mobile/androidBridgePolyfill.ts > "$RUNNER_TEMP/pre-privacy-bridge.ts"
          if BRIDGE_SOURCE="$RUNNER_TEMP/pre-privacy-bridge.ts" node --import tsx scripts/mobile-privacy-test.mjs > chat-smoke-results/privacy-baseline.log 2>&1; then
            echo 'Privacy regression did not detect old bridge'; exit 1
          fi
          node scripts/mobile-cloud-read-test.mjs
          node scripts/mobile-protective-backup-test.mjs
          node --import tsx scripts/mobile-webdav-credentials-test.mjs
          git show 4756a2c:infrastructure/mobile/androidBridgePolyfill.ts > "$RUNNER_TEMP/pre-backup-bridge.ts"
          if BRIDGE_SOURCE="$RUNNER_TEMP/pre-backup-bridge.ts" node scripts/mobile-protective-backup-test.mjs > cloud-read-results/protective-baseline.log 2>&1; then
            echo 'Protective backup regression did not detect old bridge'; exit 1
          fi
          node scripts/mobile-vault-key-test.mjs
          git show v3.1.5:infrastructure/mobile/androidBridgePolyfill.ts > "$RUNNER_TEMP/v315-vault-bridge.ts"
          if BRIDGE_SOURCE="$RUNNER_TEMP/v315-vault-bridge.ts" node scripts/mobile-vault-key-test.mjs > cloud-read-results/vault-baseline.log 2>&1; then
            echo 'Vault regression did not detect v3.1.7 trailing-byte incompatibility'; exit 1
          fi
          git show v3.1.4:infrastructure/mobile/androidBridgePolyfill.ts > "$RUNNER_TEMP/v314-cloud-bridge.ts"
          if BRIDGE_SOURCE="$RUNNER_TEMP/v314-cloud-bridge.ts" node scripts/mobile-cloud-read-test.mjs > cloud-read-results/baseline.log 2>&1; then
            echo 'Cloud regression did not detect v3.1.4'; exit 1
          fi
          npx tsc --noEmit -p tsconfig.json > mobile-typecheck.log 2>&1 || true
          if grep -E '^(infrastructure/mobile/|components/cloud-sync/CloudSyncControls|components/CloudSyncSettings|components/sftp/SftpFileRow|components/sftp/SftpPaneTreeNode|infrastructure/persistence/localStorageAdapter|infrastructure/config/i18n|application/state/useAutoSync|infrastructure/services/adapters/)' mobile-typecheck.log; then
            cat mobile-typecheck.log
            echo 'Mobile changes have TypeScript errors'; exit 1
          fi
          node --experimental-strip-types scripts/mobile-bridge-test.mjs
          node --test scripts/mobile-ui-safety.test.cjs
          node --import tsx --test infrastructure/services/cloudSync/mobilePullOnly.test.ts
          python -m pip install javalang
          python scripts/mobile-native-safety.py
          mkdir -p android/assets/www
          cp -r dist/* android/assets/www/
          ls -la android/assets/www/

      - name: Upload boot regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-boot-smoke
          path: |
            boot-smoke-results/
            baseline-startup.log
            webdav-smoke-results/
            ai-smoke-results/
            chat-smoke-results/
            cloud-read-results/

      - name: Download JSch 0.2.21 & BouncyCastle 1.79 Libraries
        run: |
          mkdir -p build_libs
          curl -fsSL https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.21/jsch-0.2.21.jar -o build_libs/jsch.jar
          curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar -o build_libs/bcprov.jar
          ls -lh build_libs/

      - name: Execute native encrypted backup store integration
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/json.jar"
          mkdir -p "$RUNNER_TEMP/backup-classes"
          javac -source 8 -target 8 -cp "$RUNNER_TEMP/json.jar" -d "$RUNNER_TEMP/backup-classes" android/src/de/newaii/netcatty/VaultBackups.java scripts/VaultBackupsIntegration.java
          java -cp "$RUNNER_TEMP/backup-classes:$RUNNER_TEMP/json.jar" VaultBackupsIntegration "$RUNNER_TEMP/backup-fixture"

      - name: Execute native SFTP integration against loopback OpenSSH
        run: bash scripts/mobile-sftp-integration.sh

      - name: Compile & Sign Android APK
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          BT_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          PLATFORM_DIR=$(ls -1d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"
          echo "Using build-tools: $BT_DIR"
          echo "Using platform: $ANDROID_JAR"

          mkdir -p build_apk/gen build_apk/obj build_apk/dex dist_apk

          echo "1. Compiling resources with aapt..."
          "$BT_DIR/aapt" package -f -m \
            -J build_apk/gen \
            -M android/AndroidManifest.xml \
            -S android/res \
            -I "$ANDROID_JAR"

          echo "2. Compiling Java sources with javac..."
          javac -source 1.8 -target 1.8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR:build_libs/jsch.jar:build_libs/bcprov.jar" \
            -d build_apk/obj \
            build_apk/gen/de/newaii/netcatty/R.java \
            android/src/de/newaii/netcatty/*.java

          echo "3. Converting bytecode + JSch + BouncyCastle to DEX with d8..."
          JAR_CLASSES=$(find build_apk/obj -name "*.class")
          "$BT_DIR/d8" --lib "$ANDROID_JAR" --min-api 24 --release --output build_apk/dex \
            $JAR_CLASSES \
            build_libs/jsch.jar \
            build_libs/bcprov.jar

          echo "4. Packaging unsigned APK..."
          "$BT_DIR/aapt" package -f \
            -M android/AndroidManifest.xml \
            -S android/res \
            -A android/assets \
            -I "$ANDROID_JAR" \
            -0 png -0 jpg -0 webp -0 svg -0 woff2 -0 ttf -0 wasm \
            -F build_apk/unsigned.apk build_apk/dex

          echo "5. Zipaligning APK..."
          "$BT_DIR/zipalign" -f -p 4 build_apk/unsigned.apk build_apk/aligned.apk

          echo "6. Signing APK..."
          printf '%s' "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > build_apk/release.p12
          chmod 600 build_apk/release.p12

          "$BT_DIR/apksigner" sign \
            --ks build_apk/release.p12 \
            --ks-key-alias netcattykey \
            --ks-pass env:ANDROID_SIGNING_PASSWORD \
            --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out dist_apk/Netcatty-Mate-v3.1.7-Android.apk \
            build_apk/aligned.apk

          ls -lh dist_apk/Netcatty-Mate-v3.1.7-Android.apk

      - name: Verify APK signature and publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mate-android-v3.1.7
          path: dist_apk/*.apk

      - name: Verify signed APK
        run: |
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist_apk/Netcatty-Mate-v3.1.7-Android.apk

      - name: Publish GitHub Release v3.1.7
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist_apk/Netcatty-Mate-v3.1.7-Android.apk \
            -R AncientIceX/Netcatty-mate --draft=false --prerelease=false \
            --verify-tag --title "Netcatty Mate v3.1.7" --notes-file android/RELEASE-v3.1.7.md
