name: Build Netcatty Mate Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Netcatty Mate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Frontend Dependencies & Build Official Netcatty Bundle
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          npx patch-package
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-webgl-atlas.cjs
          node scripts/copy-monaco.cjs
          npm run build
          mkdir -p android/assets/www
          cp -r dist/* android/assets/www/
          ls -la android/assets/www/

      - name: Download JSch 0.2.21 & BouncyCastle 1.79 Libraries
        run: |
          mkdir -p build_libs
          curl -fsSL https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.21/jsch-0.2.21.jar -o build_libs/jsch.jar
          curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar -o build_libs/bcprov.jar
          ls -lh build_libs/

      - name: Compile & Sign Android APK
        run: |
          set -e
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          BT_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          PLATFORM_DIR=$(ls -1d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          ANDROID_JAR="$PLATFORM_DIR/android.jar"
          echo "Using build-tools: $BT_DIR"
          echo "Using platform: $ANDROID_JAR"

          mkdir -p build_apk/gen build_apk/obj build_apk/dex dist_apk

          echo "1. Compiling resources with aapt..."
          "$BT_DIR/aapt" package -f -m \
            -J build_apk/gen \
            -M android/AndroidManifest.xml \
            -S android/res \
            -I "$ANDROID_JAR"

          echo "2. Compiling Java sources with javac..."
          javac -source 1.8 -target 1.8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR:build_libs/jsch.jar:build_libs/bcprov.jar" \
            -d build_apk/obj \
            build_apk/gen/de/newaii/netcatty/R.java \
            android/src/de/newaii/netcatty/*.java

          echo "3. Converting bytecode + JSch + BouncyCastle to DEX with d8..."
          JAR_CLASSES=$(find build_apk/obj -name "*.class")
          "$BT_DIR/d8" --lib "$ANDROID_JAR" --min-api 24 --release --output build_apk/dex \
            $JAR_CLASSES \
            build_libs/jsch.jar \
            build_libs/bcprov.jar

          echo "4. Packaging unsigned APK..."
          "$BT_DIR/aapt" package -f \
            -M android/AndroidManifest.xml \
            -S android/res \
            -A android/assets \
            -I "$ANDROID_JAR" \
            -0 png -0 jpg -0 webp -0 svg -0 woff2 -0 ttf -0 wasm \
            -F build_apk/unsigned.apk build_apk/dex

          echo "5. Zipaligning APK..."
          "$BT_DIR/zipalign" -f -p 4 build_apk/unsigned.apk build_apk/aligned.apk

          echo "6. Signing APK..."
          keytool -genkeypair -v \
            -keystore build_apk/release.keystore \
            -alias netcattykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass netcatty123 \
            -keypass netcatty123 \
            -dname "CN=Netcatty Mate, OU=Mobile, O=Newaii, L=Cloud, S=Cloud, C=DE"

          "$BT_DIR/apksigner" sign \
            --ks build_apk/release.keystore \
            --ks-key-alias netcattykey \
            --ks-pass pass:netcatty123 \
            --key-pass pass:netcatty123 \
            --out dist_apk/Netcatty-Mate-v3.0.0-Android.apk \
            build_apk/aligned.apk

          ls -lh dist_apk/Netcatty-Mate-v3.0.0-Android.apk

      - name: Publish GitHub Release v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0.0"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist_apk/Netcatty-Mate-v3.0.0-Android.apk \
            --title "Netcatty Mate v3.0.0 (原版 Netcatty UI 移动版 + JSch SSHv2/SFTP 完整客户端)" \
            --notes "直接基于开源原版 Netcatty (React 19 + TypeScript + Tailwind CSS + Radix UI + xterm.js 5.5.0) 源码深度适配打造的原汁原味手机版，底层搭载原生 Android JSch 0.2.21 + BouncyCastle 1.79 引擎：完整保留原版 Vaults 主机墙/列表/树状视图、官方发行版图标、密钥链管理、Snippets 代码片段、端口转发、Known Hosts、实时 Server Monitor、右侧/底部 System Manager（进程/Docker/监听端口/Systemd 服务）以及 10+ 套原版暗黑/亮色主题；针对手机触屏优化了应用内全屏设置面板、全宽抽屉详情栏、SFTP 单双栏切换与终端底部虚拟扩展按键栏；严格锁定「只下拉同步，不上传同步」（云同步仅从云端只读拉取合并，SFTP 仅允许从远端服务器下载至本地沙盒）。"
