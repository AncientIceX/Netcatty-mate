name: Build Netcatty Mate Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Sign Netcatty Mate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Frontend Dependencies & Build Official Netcatty Bundle
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci --ignore-scripts
          npx patch-package
          node scripts/patch-xterm-macos-column-selection.cjs
          node scripts/patch-xterm-foreground-intense.cjs
          node scripts/patch-xterm-webgl-atlas.cjs
          node scripts/copy-monaco.cjs
          npm run build
          mkdir -p android/assets/www
          cp -r dist/* android/assets/www/
          ls -la android/assets/www/

      - name: Download JSch 0.2.21 & BouncyCastle 1.79 Libraries
        run: |
          mkdir -p build_libs
          curl -fsSL https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.21/jsch-0.2.21.jar -o build_libs/jsch.jar
          curl -fsSL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.79/bcprov-jdk18on-1.79.jar -o build_libs/bcprov.jar
          ls -lh build_libs/

      - name: Compile & Sign Android APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p build/gen build/obj build/dex dist_apk

          echo "1. Compiling resources with aapt..."
          "$BUILD_TOOLS/aapt" package -f -m \
            -J build/gen \
            -M android/AndroidManifest.xml \
            -S android/res \
            -A android/assets \
            -I "$PLATFORM"

          echo "2. Compiling Java sources with javac..."
          javac -source 11 -target 11 -encoding UTF-8 \
            -bootclasspath "$PLATFORM" \
            -classpath "$PLATFORM:build_libs/jsch.jar:build_libs/bcprov.jar" \
            -d build/obj \
            build/gen/de/newaii/netcatty/R.java \
            android/src/de/newaii/netcatty/MainActivity.java

          echo "3. Converting bytecode + JSch + BouncyCastle to DEX with d8..."
          JAR_CLASSES=$(find build/obj -name "*.class")
          "$BUILD_TOOLS/d8" --min-api 24 \
            --lib "$PLATFORM" \
            --output build/dex \
            $JAR_CLASSES \
            build_libs/jsch.jar \
            build_libs/bcprov.jar

          echo "4. Packaging unsigned APK..."
          "$BUILD_TOOLS/aapt" package -f \
            -M android/AndroidManifest.xml \
            -S android/res \
            -A android/assets \
            -I "$PLATFORM" \
            -F build/unsigned.apk

          echo "5. Adding DEX files to APK..."
          cd build/dex
          zip -q ../unsigned.apk classes*.dex
          cd ../..

          echo "6. Zipaligning APK..."
          "$BUILD_TOOLS/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          echo "7. Signing APK..."
          keytool -genkeypair \
            -alias netcattykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore build/release.keystore \
            -storepass netcatty123 \
            -keypass netcatty123 \
            -dname "CN=Netcatty Mate, OU=Mobile, O=Newaii, L=Cloud, S=Cloud, C=DE"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-key-alias netcattykey \
            --ks-pass pass:netcatty123 \
            --key-pass pass:netcatty123 \
            --out dist_apk/Netcatty-Mate-v3.0.0-Android.apk \
            build/aligned.apk

          ls -lh dist_apk/Netcatty-Mate-v3.0.0-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netcatty-Mate-v3.0.0-Android
          path: dist_apk/Netcatty-Mate-v3.0.0-Android.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Netcatty Mate Mobile ${{ github.ref_name }} (Official Netcatty UI + JSch SSHv2/SFTP)"
          body: |
            ## Netcatty Mate Mobile ${{ github.ref_name }} (Android Edition)
            Built directly from the official **Netcatty** React 19 + TypeScript + Tailwind CSS + Radix UI + xterm.js 5.5.0 codebase (`AncientIceX/Netcatty-mate`), paired with our native Android **JSch 0.2.21 + BouncyCastle 1.79** SSHv2/SFTP/PortForwarding engine.

            ### Highlights
            - **100% Authentic Netcatty UI & Themes**: Original Vaults, Hosts grid/list/tree views, Distro avatars, Keychain manager, Snippets manager, Port Forwarding, Known Hosts, Server Monitor, System Manager (Processes, Docker, Ports, Systemd), and 10+ official Dark/Light UI & Terminal themes.
            - **Mobile Responsive & Touch Adapted**:
              - In-app full-screen Settings overlay with horizontal scrollable tab bar on mobile screens.
              - Responsive full-width AsidePanels for Host Details, Keychain, Snippets, and Port Forwarding editors.
              - Single-pane / Split-pane switcher (`Remote SFTP` / `Local Sandbox` / `Split`) in SFTP view.
              - Dedicated mobile terminal touch keybar (`ESC`, `TAB`, `CTRL`, `ALT`, arrows, `HOME`/`END`, `PGUP`/`PGDN`, `CTRL+C/D/Z/L`, `/`, `-`, `|`, `~`, `CMD`).
            - **Strict Pull-Only Cloud Sync & SFTP Protection**:
              - **Cloud Sync (GitHub Gist / WebDAV / S3)**: Strictly read-only pull & merge (`downloadFromProvider`). Never uploads, overwrites, or deletes remote cloud vaults.
              - **SFTP**: Strictly read-only on remote servers (`openSftp`, `listSftp`, `statSftp`, `readSftp`, and streaming download to local Android storage). Remote upload/write/delete/mkdir operations are blocked.
          files: |
            dist_apk/Netcatty-Mate-v3.0.0-Android.apk
          draft: false
          prerelease: false
